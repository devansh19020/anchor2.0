# ===============================
# Application
# ===============================
spring.application.name=api-gateway

# ===============================
# Server
# ===============================
server.port=8080


# ===============================
# User Service
# ===============================
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**


# ===============================
# Repository Service
# ===============================
spring.cloud.gateway.routes[1].id=repository-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/repositories/**


# ===============================
# AI Service
# ===============================
spring.cloud.gateway.routes[2].id=ai-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/chat/**


# # ===============================
# # Temporary Testing Route
# # ===============================
