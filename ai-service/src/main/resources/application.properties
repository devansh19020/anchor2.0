spring.application.name=ai-service
server.port=8083

# Gemini
gemini.api-key=${GEMINI_API_KEY}
gemini.embedding-model=gemini-embedding-2
gemini.chat-model=gemini-3.5-flash

# Chroma
chroma.host=${CHROMA_HOST:localhost}
chroma.port=${CHROMA_PORT:8000}
chroma.collection.name=${CHROMA_COLLECTION_NAME:anchor-codebase}

# Search
search.top-k=5
search.minimum-score=0.3