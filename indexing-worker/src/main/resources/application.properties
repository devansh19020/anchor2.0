spring.application.name=indexing-worker
server.port=8084

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=anchor-indexing-worker
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.devansh.indexing.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.devansh.indexing.event.RepositoryImportedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Actuator
management.endpoints.web.exposure.include=health,info